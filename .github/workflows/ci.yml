name: Verificacoes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes da Central
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript
        run: node --check static/app.js
      - name: Testar proximos inicios no navegador
        run: node tests/test_upcoming.cjs
